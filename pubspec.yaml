name: frevolt_leegality_plugin
description: A Flutter plugin for integrating Leegality e-signature functionality into FlutterFlow applications
version: 1.0.0
homepage: https://github.com/vijayfrevolt/frevolt_leegality_plugin

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
    
  plugin_platform_interface: ^2.1.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  integration_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: com.example.frevolt_leegality_plugin
        pluginClass: FrevoltLeegalityPlugin
      ios:
        pluginClass: FrevoltLeegalityPlugin